[package]
name = "figdriver"
version = "0.1.0"
authors = ["Claudio Matsuoka <cmatsuoka@gmail.com>"]
edition = "2021"

[lib]
name = "figdriver"
path = "src/lib.rs"

[[bin]]
name = "figlet"
path = "src/bin/figlet/main.rs"
doc = false

[dependencies]
pico-args = "0.5"
regex = "1"

[profile.release]
lto = true
