[package]
name = "figdriver"
version = "0.2.0"
authors = ["Claudio Matsuoka"]
edition = "2021"
description = "Render text as ASCII-art banners"
repository = "https://github.com/cmatsuoka/figdriver-rs"
license = "MIT"
keywords = ["ascii", "ascii-art", "terminal"]
readme = "README.md"
categories = ["text-processing"]

[lib]
name = "figdriver"
path = "src/lib.rs"

[[bin]]
name = "figlet"
path = "src/bin/figlet/main.rs"
doc = false
required-features = ["cli"]

[features]
default = []
cli = ["pico-args", "terminal_size"]

[dependencies]
unicode-width = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dependencies.pico-args]
version = "0.5"
features = ["combined-flags", "short-space-opt", "eq-separator"]
optional = true

[dependencies.terminal_size]
version = "0.4"
optional = true

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
