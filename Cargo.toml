[package]
name = "figdriver"
version = "0.2.0"
authors = ["Claudio Matsuoka"]
edition = "2021"
description = "Render text as ASCII-art banners"
repository = "https://github.com/cmatsuoka/figdriver-rs"
license = "MIT"
keywords = ["ascii", "ascii-art", "terminal"]

[lib]
name = "figdriver"
path = "src/lib.rs"

[[bin]]
name = "figlet"
path = "src/bin/figlet/main.rs"
doc = false

[dependencies]
pico-args = { version = "0.5", features = ["combined-flags", "short-space-opt", "eq-separator"] }
terminal_size = "0.4"
unicode-width = "0.2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
