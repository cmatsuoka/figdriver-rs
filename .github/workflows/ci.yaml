name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test --features cli
      - run: cargo run --example hello
      - run: cargo run --example showfonts
      - run: echo "Hello CI" | cargo run --example simple
      - run: cargo build --features cli
      - run: target/debug/figlet --version | grep "^figlet .* (FIGdriver-rs)"
        if: matrix.os != 'windows-latest'
      - run: target/debug/figlet --version | findstr /R "figlet.*FIGdriver-rs"
        if: matrix.os == 'windows-latest'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -- -D warnings
